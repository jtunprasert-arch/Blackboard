<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cloud BlackBoard Pro - Fix Colors</title>
<style>
  :root {
    --bg-dark: #1a1a1a;
    --board-green: #1b3022; 
    --chalk-dust: rgba(255, 255, 255, 0.05);
    --b-w: 2000px;
    --b-h: 1500px;
  }

  body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); overflow: hidden; touch-action: none; }
  #container { display: flex; width: 100vw; height: 100vh; padding: 10px; gap: 10px; box-sizing: border-box; }
  
  /* Viewport & Board */
  #viewport { flex: 4.5; position: relative; border: 8px solid #4e342e; border-radius: 12px; background-color: #000; overflow: hidden; }
  #board { 
    width: var(--b-w); height: var(--b-h); position: absolute; 
    background-color: var(--board-green);
    background-image: radial-gradient(circle, var(--chalk-dust) 1px, transparent 1px);
    background-size: 40px 40px;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.5);
    will-change: transform;
  }

  /* Sidebar Optimization */
  #sidebar { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 240px; max-width: 300px; z-index: 2000; }
  #palette { 
    background: #2a2a2a; border: 1px solid #444; border-radius: 10px; 
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; 
    padding: 10px; overflow-y: auto; flex-grow: 1; touch-action: pan-y;
  }
  
  /* Mini-map */
  #minimap {
    position: absolute; bottom: 15px; right: 15px; width: 150px; height: 112px;
    background: rgba(0,0,0,0.7); border: 2px solid rgba(255,255,255,0.2);
    border-radius: 6px; pointer-events: none; overflow: hidden; z-index: 5000;
  }
  .map-dot { position: absolute; width: 5px; height: 5px; border-radius: 1px; transform: translate(-50%, -50%); }

  /* Note Styles */
  .postit { border-radius: 2px; position: absolute; width: 140px; min-height: 140px; padding: 22px 10px 35px; box-shadow: 8px 8px 15px rgba(0,0,0,0.4); touch-action: none; cursor: grab; }
  .content { outline: none; white-space: pre-wrap; font-size: 14px; min-height: 85px; color: inherit; }
  .delete-btn { position: absolute; top: 4px; right: 4px; border: none; background: rgba(0,0,0,0.1); border-radius: 50%; width: 22px; height: 22px; cursor: pointer; color: inherit; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  
  /* Palette Item */
  .palette-item { aspect-ratio: 1/1; border-radius: 5px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.1s; }
  .palette-item:hover { transform: scale(1.1); z-index: 10; }
  
  /* Buttons */
  .btn-group { display: flex; flex-direction: column; gap: 6px; }
  .btn-ui { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .btn-org { background: #f39c12; }
  .btn-clear { background: #c1121f; }

  @media (max-width: 768px) {
    #container { flex-direction: column-reverse; padding: 5px; }
    #sidebar { min-width: 100%; flex: 0.35; flex-direction: row; height: 115px; }
    #palette { grid-template-columns: repeat(8, 1fr); height: 80px; flex-grow: 1; }
    .btn-group { width: 110px; }
    .btn-ui { font-size: 11px; padding: 8px; }
    #minimap { width: 100px; height: 75px; bottom: 125px; right: 10px; }
  }

  /* Colors - ครบทั้ง 24 สี */
  .yellow { background: #fff475; color: #333; } .pink { background: #ff9aa2; color: #333; }
  .green { background: #b5e7a0; color: #333; } .blue { background: #a0c4ff; color: #333; }
  .orange { background: #ffb347; color: #333; } .lavender { background: #e1ceff; color: #333; }
  .mint { background: #c1f0e8; color: #333; } .rose { background: #ffc8dd; color: #333; }
  .clay { background: #cb997e; color: #fff; } .dark { background: #3d405b; color: #fff; }
  .teal { background: #81b29a; color: #fff; } .cream { background: #fefae0; color: #333; }
  .coral { background: #ff8b94; color: #fff; } .lime { background: #d4fc79; color: #333; }
  .sky { background: #caf0f8; color: #333; } .coffee { background: #6f4e37; color: #fff; }
  .gold { background: #ffd700; color: #333; } .plum { background: #6a0572; color: #fff; }
  .smoke { background: #8d99ae; color: #fff; } .forest { background: #2d6a4f; color: #fff; }
  .brick { background: #bc4749; color: #fff; } .mustard { background: #e9c46a; color: #333; }
  .indigo { background: #4cc9f0; color: #333; } .peach { background: #f4a261; color: #fff; }
</style>
</head>
<body>

<div id="container">
  <div id="viewport">
    <div id="board"></div>
    <div id="minimap"></div>
  </div>
  
  <div id="sidebar">
    <div id="palette"></div>
    <div class="btn-group">
      <button class="btn-ui btn-org" onclick="organizeNotes()">🪄 จัดระเบียบ</button>
      <button class="btn-ui btn-clear" onclick="clearAllData()">🗑️ ล้างบอร์ด</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update, serverTimestamp, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBIUG8gWfcx66oUIBZuDEpSPfylakaGjH8",
    authDomain: "blackboard-568c8.firebaseapp.com",
    databaseURL: "https://blackboard-568c8-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "blackboard-568c8",
    storageBucket: "blackboard-568c8.firebasestorage.app",
    messagingSenderId: "913291256438",
    appId: "1:913291256438:web:ad16d061da1bd3cad97557"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const postitsRef = ref(db, 'postits');

  const board = document.getElementById('board');
  const viewport = document.getElementById('viewport');
  const minimap = document.getElementById('minimap');

  let isMobile = window.innerWidth <= 768;
  let pan = { x: 0, y: 0, isPanning: false, startX: 0, startY: 0 };

  // --- ระบบปรับเลเอาต์และ Panning ---
  function applyPan() {
    if (isMobile) {
      const minX = viewport.offsetWidth - 2000;
      const minY = viewport.offsetHeight - 1500;
      pan.x = Math.max(minX, Math.min(0, pan.x));
      pan.y = Math.max(minY, Math.min(0, pan.y));
    } else { pan.x = 0; pan.y = 0; }
    board.style.transform = `translate(${pan.x}px, ${pan.y}px)`;
  }

  window.addEventListener('resize', () => { isMobile = window.innerWidth <= 768; applyPan(); });

  viewport.onmousedown = (e) => { if (!isMobile || (e.target !== viewport && e.target !== board)) return; pan.isPanning = true; pan.startX = e.clientX - pan.x; pan.startY = e.clientY - pan.y; };
  viewport.ontouchstart = (e) => { if (!isMobile || (e.target !== viewport && e.target !== board)) return; pan.isPanning = true; pan.startX = e.touches[0].clientX - pan.x; pan.startY = e.touches[0].clientY - pan.y; };
  window.onmousemove = (e) => { if (!pan.isPanning) return; pan.x = e.clientX - pan.startX; pan.y = e.clientY - pan.startY; applyPan(); };
  window.ontouchmove = (e) => { if (!pan.isPanning) return; pan.x = e.touches[0].clientX - pan.startX; pan.y = e.touches[0].clientY - pan.startY; applyPan(); };
  window.onmouseup = window.ontouchend = () => { pan.isPanning = false; };

  // --- จัดการโน้ต ---
  let activeId = null, noteOffX = 0, noteOffY = 0, isMoved = false;

  function handleNoteStart(e, id) {
    if (e.target.closest('.content') || e.target.closest('.delete-btn')) return;
    e.stopPropagation(); activeId = id; isMoved = false;
    const el = document.getElementById(id);
    const rect = el.getBoundingClientRect();
    const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    noteOffX = cx - rect.left; noteOffY = cy - rect.top;
    el.style.zIndex = 10000;
  }

  window.addEventListener('mousemove', (e) => {
    if (!activeId) return; isMoved = true;
    const cx = e.clientX, cy = e.clientY;
    const el = document.getElementById(activeId);
    let nx = cx - pan.x - viewport.offsetLeft - noteOffX;
    let ny = cy - pan.y - viewport.offsetTop - noteOffY;
    el.style.left = Math.max(0, Math.min(1860, nx)) + 'px';
    el.style.top = Math.max(0, Math.min(1360, ny)) + 'px';
  });

  window.addEventListener('mouseup', () => {
    if (activeId && isMoved) {
      const el = document.getElementById(activeId);
      update(ref(db, 'postits/' + activeId), { x: parseInt(el.style.left), y: parseInt(el.style.top), updatedAt: serverTimestamp() });
    }
    activeId = null;
  });

  // --- จัดระเบียบโน้ต ---
  window.organizeNotes = () => {
    if(confirm("ดึงโน้ตทุกใบกลับมาเรียงใหม่?")) {
      onValue(postitsRef, (snap) => {
        let i = 0;
        snap.forEach((child) => {
          update(ref(db, 'postits/' + child.key), { x: (i%4)*155 + 30, y: Math.floor(i/4)*155 + 30, updatedAt: serverTimestamp() });
          i++;
        });
      }, { onlyOnce: true });
      pan.x = 0; pan.y = 0; applyPan();
    }
  };

  // --- สร้าง Palette สีครบ 24 สี ---
  const COLORS = ['yellow', 'pink', 'green', 'blue', 'orange', 'lavender', 'mint', 'rose', 'clay', 'dark', 'teal', 'cream', 'coral', 'lime', 'sky', 'coffee', 'gold', 'plum', 'smoke', 'forest', 'brick', 'mustard', 'indigo', 'peach'];
  COLORS.forEach(c => {
    const d = document.createElement('div'); d.className = `palette-item ${c}`;
    d.onclick = () => push(postitsRef, { color: c, text: "", x: (viewport.offsetWidth/2)-pan.x-70, y: (viewport.offsetHeight/2)-pan.y-70, updatedAt: serverTimestamp() });
    document.getElementById('palette').appendChild(d);
  });

  // --- Firebase Sync ---
  onValue(query(postitsRef, orderByChild('updatedAt')), (snap) => {
    const ids = []; minimap.innerHTML = "";
    snap.forEach((child) => {
      const id = child.key, data = child.val(); ids.push(id);
      let p = document.getElementById(id);
      if (!p) {
        p = document.createElement('div'); p.id = id;
        p.innerHTML = `<div class="content" contenteditable="true" spellcheck="false"></div><button class="delete-btn">✕</button>`;
        p.querySelector('.delete-btn').onclick = () => remove(ref(db, 'postits/' + id));
        p.querySelector('.content').onblur = (e) => update(ref(db, 'postits/' + id), { text: e.target.innerText, updatedAt: serverTimestamp() });
        p.addEventListener('mousedown', (e) => handleNoteStart(e, id));
        p.addEventListener('touchstart', (e) => handleNoteStart(e, id), { passive: false });
        board.appendChild(p);
      }
      p.className = `postit ${data.color}`;
      if (activeId !== id) { p.style.left = data.x + 'px'; p.style.top = data.y + 'px'; }
      const content = p.querySelector('.content');
      if (document.activeElement !== content) content.innerText = data.text || "";
      
      const dot = document.createElement('div');
      dot.className = `map-dot ${data.color}`;
      dot.style.left = (data.x / 2000 * 100) + "%";
      dot.style.top = (data.y / 1500 * 100) + "%";
      minimap.appendChild(dot);
    });
    document.querySelectorAll('.postit').forEach(el => { if (!ids.includes(el.id)) el.remove(); });
  });

  window.clearAllData = () => { if(confirm("ล้างกระดานดำ?")) remove(postitsRef); };
  applyPan();
</script>
</body>
</html>
