<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>Cloud BlackBoard - Real-time Collaboration</title>
<style>
  body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1a1a1a; overflow: hidden; }
  #container { display: flex; width: 100vw; height: 100vh; padding: 15px; gap: 15px; box-sizing: border-box; }
  
  /* BlackBoard Area */
  #board { 
    flex: 4.5; 
    background-color: #222; /* เปลี่ยนเป็น #1b3022 หากต้องการสีเขียวเข้มกระดานดำ */
    background-image: radial-gradient(#333 1px, transparent 1px);
    background-size: 30px 30px;
    border: 10px solid #444; 
    border-radius: 8px; 
    position: relative; 
    overflow: hidden; 
    box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
  }

  /* Sidebar */
  #sidebar { flex: 1; display: flex; flex-direction: column; gap: 15px; min-width: 260px; }
  #palette { background: #333; border: 1px solid #555; border-radius: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; overflow-y: auto; flex-grow: 1; }
  
  /* Post-it */
  .postit { border-radius: 2px; box-sizing: border-box; font-weight: 600; cursor: grab; position: absolute; min-width: 150px; min-height: 150px; padding: 25px 15px 35px; box-shadow: 5px 5px 15px rgba(0,0,0,0.4); z-index: 10; touch-action: none; }
  .postit:active { cursor: grabbing; z-index: 1000; transform: scale(1.02); }
  
  .content { outline: none; white-space: pre-wrap; font-size: 15px; min-height: 90px; cursor: text; line-height: 1.4; color: #333; }
  
  /* Meta Info (Status & Time) */
  .meta-info { position: absolute; bottom: 6px; left: 8px; font-size: 9px; font-weight: normal; opacity: 0.7; pointer-events: none; }
  .status-tag { font-weight: bold; margin-right: 4px; }
  
  .delete-btn { position: absolute; top: 4px; right: 4px; border: none; background: rgba(0,0,0,0.1); border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; color: inherit; display: flex; align-items: center; justify-content: center; }
  .palette-item { position: static; min-width: auto; min-height: 45px; border-radius: 4px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
  .btn-clear { padding: 12px; background: #c1121f; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

  /* Colors */
  .yellow { background: #fff475; } .pink { background: #ff9aa2; } .green { background: #b5e7a0; }
  .blue { background: #a0c4ff; } .orange { background: #ffb347; } .lavender { background: #e1ceff; }
  .mint { background: #c1f0e8; } .rose { background: #ffc8dd; } .clay { background: #cb997e; }
  .dark { background: #3d405b; color: white; } .teal { background: #81b29a; } .cream { background: #fefae0; }
  .coral { background: #ff8b94; } .lime { background: #d4fc79; } .sky { background: #caf0f8; }
  .coffee { background: #6f4e37; color: white; } .gold { background: #ffd700; } .plum { background: #6a0572; color: white; }
  .smoke { background: #8d99ae; color: white; } .forest { background: #2d6a4f; color: white; }
  .brick { background: #bc4749; color: white; } .mustard { background: #e9c46a; } .indigo { background: #4cc9f0; } .peach { background: #f4a261; }
</style>
</head>
<body>

<div id="container">
  <div id="board" id="blackboard"></div>

  <div id="sidebar">
    <div id="palette"></div>
    <button class="btn-clear" onclick="clearAllData()">🗑️ ล้างกระดาน (ทุกคน)</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // ชุด Config จากภาพ blackboard-568c8 ของคุณ
  const firebaseConfig = {
    apiKey: "AIzaSyBIUG8gWfcx66oUIBZuDEpSPfylakaGjH8",
    authDomain: "blackboard-568c8.firebaseapp.com",
    databaseURL: "https://blackboard-568c8-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "blackboard-568c8",
    storageBucket: "blackboard-568c8.firebasestorage.app",
    messagingSenderId: "913291256438",
    appId: "1:913291256438:web:ad16d061da1bd3cad97557",
    measurementId: "G-FP4ZR9443W"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const postitsRef = ref(db, 'postits');

  const COLOR_LIST = ['yellow', 'pink', 'green', 'blue', 'orange', 'lavender', 'mint', 'rose', 'clay', 'dark', 'teal', 'cream', 'coral', 'lime', 'sky', 'coffee', 'gold', 'plum', 'smoke', 'forest', 'brick', 'mustard', 'indigo', 'peach'];

  function formatTime(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return `${d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}`;
  }

  // สร้าง Palette
  COLOR_LIST.forEach(color => {
    const d = document.createElement('div');
    d.className = `palette-item ${color}`;
    d.onclick = () => push(postitsRef, { 
      color, text: "", x: 100, y: 100, 
      updatedAt: serverTimestamp(), action: "🆕 สร้าง" 
    });
    document.getElementById('palette').appendChild(d);
  });

  let activeId = null, startX, startY, initialX, initialY, isMoved = false;

  function onMouseDown(e, id, data) {
    if (e.target.className === 'content' || e.target.className === 'delete-btn') return;
    activeId = id; startX = e.clientX; startY = e.clientY;
    initialX = data.x; initialY = data.y; isMoved = false;
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  }

  function onMouseMove(e) {
    if (!activeId) return;
    isMoved = true;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    const el = document.getElementById(activeId);
    el.style.left = (initialX + dx) + 'px';
    el.style.top = (initialY + dy) + 'px';
  }

  function onMouseUp() {
    if (activeId && isMoved) {
      const el = document.getElementById(activeId);
      update(ref(db, 'postits/' + activeId), {
        x: parseInt(el.style.left), y: parseInt(el.style.top),
        updatedAt: serverTimestamp(), action: "📍 ย้าย"
      });
    }
    activeId = null;
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
  }

  onValue(postitsRef, (snapshot) => {
    const data = snapshot.val() || {};
    const currentIds = Object.keys(data);
    document.querySelectorAll('#board .postit').forEach(el => { if (!currentIds.includes(el.id)) el.remove(); });

    currentIds.forEach(id => {
      let p = document.getElementById(id);
      if (!p) {
        p = document.createElement('div'); p.id = id;
        p.innerHTML = `<div class="content" contenteditable="true"></div><div class="meta-info"><span class="status-tag"></span><span class="time-str"></span></div><button class="delete-btn">✕</button>`;
        p.querySelector('.delete-btn').onclick = () => remove(ref(db, 'postits/' + id));
        p.querySelector('.content').onblur = (e) => {
          update(ref(db, 'postits/' + id), { 
            text: e.target.innerText, updatedAt: serverTimestamp(), action: "✏️ แก้ไข" 
          });
        };
        document.getElementById('board').appendChild(p);
      }
      p.className = `postit ${data[id].color}`;
      p.onmousedown = (e) => onMouseDown(e, id, data[id]);
      if (activeId !== id) { p.style.left = data[id].x + 'px'; p.style.top = data[id].y + 'px'; }
      const content = p.querySelector('.content');
      if (document.activeElement !== content) content.innerText = data[id].text;
      p.querySelector('.status-tag').innerText = data[id].action || "";
      p.querySelector('.time-str').innerText = formatTime(data[id].updatedAt);
    });
  });

  window.clearAllData = () => { if(confirm("ล้างกระดานดำ?")) remove(postitsRef); };
</script>
</body>
</html>
