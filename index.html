<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>Cloud BlackBoard Pro - Scrollable</title>
<style>
  :root {
    --bg-dark: #1a1a1a;
    --board-green: #1b3022; 
    --chalk-dust: rgba(255, 255, 255, 0.05);
  }

  body, html { 
    margin: 0; padding: 0; height: 100%; 
    font-family: 'Segoe UI', Tahoma, sans-serif; 
    background-color: var(--bg-dark); 
    overflow: hidden; 
  }
  
  #container { display: flex; width: 100vw; height: 100vh; padding: 10px; gap: 10px; box-sizing: border-box; }
  
  /* พื้นที่แสดงผลหลักที่ทำหน้าที่เป็น "หน้าต่าง" */
  #board-viewport {
    flex: 4.5;
    position: relative;
    border: 8px solid #4e342e; 
    border-radius: 8px;
    background-color: var(--board-green);
    overflow: auto; /* อนุญาตให้ Scroll */
    box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
    -webkit-overflow-scrolling: touch; /* เลื่อนลื่นๆ บน iOS */
  }

  /* ขนาดบอร์ดจริงที่ใหญ่กว่าหน้าจอ */
  #board { 
    width: 2500px;  /* ขยายบอร์ดให้กว้าง */
    height: 2000px; /* ขยายบอร์ดให้สูง */
    position: relative; 
    background-image: radial-gradient(circle, var(--chalk-dust) 1px, transparent 1px);
    background-size: 40px 40px;
    touch-action: none; /* ปิด gesture พื้นฐานเฉพาะบนบอร์ดเพื่อใช้ระบบลากโน้ต */
  }

  #sidebar { flex: 1.2; display: flex; flex-direction: column; gap: 10px; min-width: 240px; z-index: 2000; }
  #palette { 
    background: #2a2a2a; border: 1px solid #444; border-radius: 12px; 
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; 
    padding: 10px; overflow-y: auto; flex-grow: 1; 
  }
  
  .postit { 
    border-radius: 2px; box-sizing: border-box; font-weight: 600; cursor: grab; 
    position: absolute; min-width: 150px; min-height: 150px; 
    padding: 25px 12px 40px; box-shadow: 8px 8px 20px rgba(0,0,0,0.4); 
    touch-action: none; will-change: left, top;
  }
  
  .content { 
    outline: none; white-space: pre-wrap; font-size: 16px; min-height: 85px; 
    line-height: 1.5; color: inherit; user-select: text; -webkit-user-select: text;
    text-shadow: 0px 0px 1px rgba(0,0,0,0.1);
  }
  
  .meta-info { 
    position: absolute; bottom: 8px; left: 10px; font-size: 10px; 
    opacity: 0.85; pointer-events: none; display: flex; align-items: center; gap: 4px;
  }
  
  .delete-btn { 
    position: absolute; top: 5px; right: 5px; border: none; 
    background: rgba(0,0,0,0.1); border-radius: 50%; width: 22px; height: 22px; 
    cursor: pointer; color: inherit;
  }

  .palette-item { aspect-ratio: 1/1; border-radius: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
  .btn-clear { padding: 12px; background: #c1121f; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

  /* Colors */
  .yellow { background: #fff475; color: #333; } .pink { background: #ff9aa2; color: #333; }
  .green { background: #b5e7a0; color: #333; } .blue { background: #a0c4ff; color: #333; }
  .orange { background: #ffb347; color: #333; } .lavender { background: #e1ceff; color: #333; }
  .mint { background: #c1f0e8; color: #333; } .rose { background: #ffc8dd; color: #333; }
  .clay { background: #cb997e; color: #fff; } .dark { background: #3d405b; color: #fff; }
  .teal { background: #81b29a; color: #fff; } .cream { background: #fefae0; color: #333; }
  .coral { background: #ff8b94; color: #fff; } .lime { background: #d4fc79; color: #333; }
  .sky { background: #caf0f8; color: #333; } .coffee { background: #6f4e37; color: #fff; }
  .gold { background: #ffd700; color: #333; } .plum { background: #6a0572; color: #fff; }
  .smoke { background: #8d99ae; color: #fff; } .forest { background: #2d6a4f; color: #fff; }
  .brick { background: #bc4749; color: #fff; } .mustard { background: #e9c46a; color: #333; }
  .indigo { background: #4cc9f0; color: #333; } .peach { background: #f4a261; color: #fff; }

  @media (max-width: 768px) {
    #container { flex-direction: column-reverse; padding: 5px; }
    #sidebar { flex: 0.3; min-width: 100%; flex-direction: row; }
    #palette { grid-template-columns: repeat(8, 1fr); height: 60px; padding: 5px; }
    .btn-clear { padding: 5px; font-size: 11px; width: 70px; }
    .postit { min-width: 140px; min-height: 140px; }
  }
</style>
</head>
<body>

<div id="container">
  <div id="board-viewport">
    <div id="board"></div>
  </div>

  <div id="sidebar">
    <div id="palette"></div>
    <button class="btn-clear" onclick="clearAllData()">🗑️ ล้างบอร์ด</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update, serverTimestamp, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBIUG8gWfcx66oUIBZuDEpSPfylakaGjH8",
    authDomain: "blackboard-568c8.firebaseapp.com",
    databaseURL: "https://blackboard-568c8-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "blackboard-568c8",
    storageBucket: "blackboard-568c8.firebasestorage.app",
    messagingSenderId: "913291256438",
    appId: "1:913291256438:web:ad16d061da1bd3cad97557"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const postitsRef = ref(db, 'postits');

  const COLOR_LIST = ['yellow', 'pink', 'green', 'blue', 'orange', 'lavender', 'mint', 'rose', 'clay', 'dark', 'teal', 'cream', 'coral', 'lime', 'sky', 'coffee', 'gold', 'plum', 'smoke', 'forest', 'brick', 'mustard', 'indigo', 'peach'];

  function formatFullDateTime(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return `${d.toLocaleDateString('th-TH', {day:'2-digit', month:'2-digit'})} | ${d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})}`;
  }

  COLOR_LIST.forEach(color => {
    const d = document.createElement('div');
    d.className = `palette-item ${color}`;
    d.onclick = () => {
      // สร้างโน้ตในตำแหน่งกึ่งกลางที่เรากำลังดูอยู่ (Center of viewport)
      const viewport = document.getElementById('board-viewport');
      const startX = viewport.scrollLeft + 50;
      const startY = viewport.scrollTop + 50;
      push(postitsRef, { 
        color, text: "", x: startX, y: startY, 
        updatedAt: serverTimestamp(), action: "🆕" 
      });
    };
    document.getElementById('palette').appendChild(d);
  });

  let activeId = null, offsetX = 0, offsetY = 0, isMoved = false;

  function handleStart(e, id) {
    if (e.target.closest('.content') || e.target.closest('.delete-btn')) return;
    
    // สำคัญ: หยุดการเลื่อนจอเมื่อกำลังเริ่มลากโน้ต
    activeId = id;
    isMoved = false;
    const el = document.getElementById(id);
    const rect = el.getBoundingClientRect();
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    
    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;
    el.style.zIndex = 10000;

    window.addEventListener('mousemove', handleMove, { passive: false });
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchend', handleEnd);
  }

  function handleMove(e) {
    if (!activeId) return;
    isMoved = true;
    if (e.cancelable) e.preventDefault(); // ป้องกันการ Scroll จอขณะลากโน้ต

    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    
    const board = document.getElementById('board');
    const boardRect = board.getBoundingClientRect();

    let newX = clientX - boardRect.left - offsetX;
    let newY = clientY - boardRect.top - offsetY;

    // จำกัดให้อยู่ในขอบบอร์ดขนาดใหญ่
    newX = Math.max(0, Math.min(newX, 2500 - 150));
    newY = Math.max(0, Math.min(newY, 2000 - 150));

    const el = document.getElementById(activeId);
    el.style.left = newX + 'px';
    el.style.top = newY + 'px';
  }

  function handleEnd() {
    if (activeId && isMoved) {
      const el = document.getElementById(activeId);
      update(ref(db, 'postits/' + activeId), {
        x: parseInt(el.style.left), 
        y: parseInt(el.style.top),
        updatedAt: serverTimestamp(), 
        action: "📍"
      });
    }
    activeId = null;
    window.removeEventListener('mousemove', handleMove);
    window.removeEventListener('touchmove', handleMove);
  }

  const sortedQuery = query(postitsRef, orderByChild('updatedAt'));

  onValue(sortedQuery, (snapshot) => {
    const currentIds = [];
    let baseZ = 100;
    snapshot.forEach((child) => {
      const id = child.key;
      const data = child.val();
      currentIds.push(id);
      baseZ++;

      let p = document.getElementById(id);
      if (!p) {
        p = document.createElement('div'); p.id = id;
        p.className = `postit ${data.color}`;
        p.innerHTML = `
          <div class="content" contenteditable="true" spellcheck="false"></div>
          <div class="meta-info">
            <span class="status-tag"></span>
            <span class="datetime-str"></span>
          </div>
          <button class="delete-btn">✕</button>`;
        
        p.querySelector('.delete-btn').onclick = () => { if(confirm("ลบโน้ต?")) remove(ref(db, 'postits/' + id)); };
        p.querySelector('.content').onblur = (e) => {
          update(ref(db, 'postits/' + id), { 
            text: e.target.innerText, updatedAt: serverTimestamp(), action: "✏️" 
          });
        };
        p.addEventListener('mousedown', (e) => handleStart(e, id));
        p.addEventListener('touchstart', (e) => handleStart(e, id), { passive: false });
        document.getElementById('board').appendChild(p);
      }
      
      p.className = `postit ${data.color}`;
      if (activeId !== id) {
        p.style.left = data.x + 'px';
        p.style.top = data.y + 'px';
        p.style.zIndex = baseZ;
      }
      const content = p.querySelector('.content');
      if (document.activeElement !== content) content.innerText = data.text || "";
      p.querySelector('.status-tag').innerText = data.action || "";
      p.querySelector('.datetime-str').innerText = formatFullDateTime(data.updatedAt);
    });
    document.querySelectorAll('.postit').forEach(el => {
      if (!currentIds.includes(el.id)) el.remove();
    });
  });

  window.clearAllData = () => { if(confirm("ล้างกระดานดำ?")) remove(postitsRef); };
</script>
</body>
</html>
